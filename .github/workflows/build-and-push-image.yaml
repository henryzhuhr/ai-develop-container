name: Build and Push Image

on:
  push:
    tags:
      - 'v*' # 匹配所有以 v 开头的 tag，例如 v1.0.0
    branches:
      - main
      - dev
      # - feature/* # 测试用
  workflow_dispatch:
    inputs:
      vscode_server_commits:
        description: 'VS Code Server commits (comma-separated)'
        default: '07ff9d6178ede9a1bd12ad3399074d726ebe6e43'
        required: false

jobs:
  build-multi-java-multi-arch:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        java_version:
          # - "11"
          # - "17"
          - "21"
        go_version:
          - "1.18"
          - "1.20"
          - "1.21"
          - "1.25"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tags
        id: tags
        env:
          GO_VERSION: ${{ matrix.go_version }}
          JAVA_VERSION: ${{ matrix.java_version }}
        run: |
          GO_TAG="go${GO_VERSION}"
          JAVA_TAG="java${JAVA_VERSION}"
          IMAGE_TAG="${GO_TAG}-${JAVA_TAG}"
          TAGS="ai-develop-container:${IMAGE_TAG}"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            REF_TAG="${GITHUB_REF#refs/tags/v}"
            TAGS="ghcr.io/${{ github.repository }}:${REF_TAG}-${IMAGE_TAG}"
            if [[ "${GO_VERSION}" == "1.25" && "${JAVA_VERSION}" == "21" ]]; then
              TAGS="${TAGS}"$'\n'"ghcr.io/${{ github.repository }}:${REF_TAG}"
            fi
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAGS="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"
            if [[ "${GO_VERSION}" == "1.25" && "${JAVA_VERSION}" == "21" ]]; then
              TAGS="${TAGS}"$'\n'"ghcr.io/${{ github.repository }}:latest"
            fi
          fi

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${TAGS}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # group: login and push to GHCR
      - name: Log in to GHCR
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfiles/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GO_TAG=${{ matrix.go_version }}
            JAVA_VERSION=${{ matrix.java_version }}
            UV_TAG=latest
            NODE_TAG=latest
            VSCODE_SERVER_COMMITS=${{ inputs.vscode_server_commits || '07ff9d6178ede9a1bd12ad3399074d726ebe6e43,cb1933bbc38d329b3595673a600fab5c7368f0a7,42b266171e51a016313f47d0c48aca9295b9cbb2' }}
          platforms: linux/amd64,linux/arm64
          pull: true
