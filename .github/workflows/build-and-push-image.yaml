name: Build and Push Image

# 本地测试构建：
#   JAVA_VERSION=21 IMAGE_TAG=test bash scripts/docker-build.sh
#   docker images | grep ai-develop-container

on:
  push:
    tags:
      - 'v*' # 匹配所有以 v 开头的 tag，例如 v1.0.0
    branches:
      - main
      - dev
      - 'feature/*'
  workflow_dispatch:
    inputs:
      vscode_server_commits:
        description: 'VS Code Server commits (comma-separated)'
        default: '07ff9d6178ede9a1bd12ad3399074d726ebe6e43'
        required: false

jobs:
  build-multi-java-multi-arch:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        java_version:
          - "11"
          - "17"
          - "21"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tags
        id: tags
        env:
          JAVA_VERSION: ${{ matrix.java_version }}
        run: |
          JAVA_TAG="java${JAVA_VERSION}"
          TAGS="ai-develop-container:ci-${JAVA_TAG}"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            REF_TAG="${GITHUB_REF#refs/tags/}"
            TAGS="ghcr.io/${{ github.repository }}:${REF_TAG}-${JAVA_TAG}"
            if [[ "${JAVA_VERSION}" == "21" ]]; then
              TAGS="${TAGS}"$'\n'"ghcr.io/${{ github.repository }}:${REF_TAG}"
            fi
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAGS="ghcr.io/${{ github.repository }}:${JAVA_TAG}"
            if [[ "${JAVA_VERSION}" == "21" ]]; then
              TAGS="${TAGS}"$'\n'"ghcr.io/${{ github.repository }}:latest"
            fi
          fi

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${TAGS}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # group: login and push to GHCR
      - name: Log in to GHCR
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image for Java ${{ matrix.java_version }}
        # 本地单架构测试：JAVA_VERSION=${{ matrix.java_version }} bash scripts/docker-build.sh
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfiles/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GO_TAG=1.25
            JAVA_VERSION=${{ matrix.java_version }}
            UV_TAG=0.10.0
            NODE_TAG=24
            VSCODE_SERVER_COMMITS=${{ inputs.vscode_server_commits || '07ff9d6178ede9a1bd12ad3399074d726ebe6e43,cb1933bbc38d329b3595673a600fab5c7368f0a7,42b266171e51a016313f47d0c48aca9295b9cbb2' }}
          platforms: linux/amd64,linux/arm64
          pull: true
